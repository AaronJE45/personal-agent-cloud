services:
  - type: web
    name: personal-ai-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn whatsapp_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: VERIFY_TOKEN
        value: metana_verify_token_123
